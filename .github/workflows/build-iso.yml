name: UzOS ISO Builder (CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build UzOS 24.04 LTS Bootable ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools & Qt6
        run: |
          sudo apt update
          sudo apt install -y \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-window \
            librsvg2-bin \
            curl

      - name: Compile Native Telegram UI Shell (C++ / Qt6)
        run: |
          make shell

      - name: Prepare Clean Linux RootFS & Apply UzOS
        run: |
          # 1. Download official Ubuntu 24.04.5 LTS base directly on Linux
          # Preserves all native Linux symlinks (/bin -> usr/bin, /lib64) and permissions
          mkdir -p rootfs
          curl -sSL -o ubuntu-base.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-amd64.tar.gz
          sudo tar -xpzf ubuntu-base.tar.gz -C rootfs

          # 2. Create required directory tree
          sudo mkdir -p rootfs/usr/share/icons \
                        rootfs/usr/share/themes \
                        rootfs/usr/share/backgrounds \
                        rootfs/usr/share/glib-2.0/schemas \
                        rootfs/usr/share/applications \
                        rootfs/usr/share/wayland-sessions \
                        rootfs/usr/share/xsessions \
                        rootfs/usr/share/plymouth/themes/spinner \
                        rootfs/usr/share/plymouth/themes/bgrt \
                        rootfs/usr/share/pixmaps \
                        rootfs/usr/bin \
                        rootfs/etc/skel/Desktop \
                        rootfs/etc/xdg/autostart \
                        rootfs/etc/profile.d \
                        rootfs/etc/apt/preferences.d \
                        rootfs/etc/sysctl.d \
                        rootfs/etc/default \
                        rootfs/etc/sudoers.d \
                        rootfs/etc/gdm3

          # 3. Install UzOS Themes, Icons, Wallpaper and Settings
          sudo cp -r themes/icons/UzOS-Telegram rootfs/usr/share/icons/
          sudo cp -r themes/gtk/UzOS-Telegram-Dark rootfs/usr/share/themes/
          sudo cp themes/wallpapers/uzos-telegram-dark.svg rootfs/usr/share/backgrounds/
          sudo cp themes/99_uzos.gschema.override rootfs/usr/share/glib-2.0/schemas/
          sudo cp themes/install-uzos.desktop rootfs/usr/share/applications/
          sudo cp themes/install-uzos.desktop rootfs/etc/skel/Desktop/
          sudo cp themes/install-uzos.desktop rootfs/etc/xdg/autostart/

          # 4. Replace Plymouth Ubuntu Boot Watermark with Native UzOS Logo
          rsvg-convert -w 256 -h 256 themes/icons/UzOS-Telegram/apps/scalable/uzos-logo.svg -o uzos-logo.png
          sudo cp uzos-logo.png rootfs/usr/share/plymouth/ubuntu-logo.png
          sudo cp uzos-logo.png rootfs/usr/share/plymouth/themes/spinner/watermark.png
          sudo cp uzos-logo.png rootfs/usr/share/plymouth/themes/bgrt/watermark.png 2>/dev/null || true
          sudo cp uzos-logo.png rootfs/usr/share/pixmaps/ubuntu-logo.png 2>/dev/null || true

          # 5. Install Native Telegram UI Shell & CLI tools
          sudo cp desktop-shell/build/uzos-shell rootfs/usr/bin/
          sudo cp desktop-shell/session/start-uzos.sh rootfs/usr/bin/
          sudo cp desktop-shell/session/uzos.desktop rootfs/usr/share/wayland-sessions/
          sudo cp desktop-shell/session/uzos.desktop rootfs/usr/share/xsessions/
          sudo cp ubuntu-base/rootfs/usr/bin/uzosfetch rootfs/usr/bin/
          sudo chmod +x rootfs/usr/bin/uzos-shell rootfs/usr/bin/start-uzos.sh rootfs/usr/bin/uzosfetch

          # 6. Apply UzOS System Configurations (Zero Telemetry, zRAM, Rebranding)
          sudo cp ubuntu-base/rootfs/etc/profile.d/uzos-env.sh rootfs/etc/profile.d/ || true
          sudo cp ubuntu-base/rootfs/etc/hosts rootfs/etc/hosts
          sudo cp ubuntu-base/rootfs/etc/lsb-release rootfs/etc/lsb-release
          sudo cp ubuntu-base/rootfs/usr/lib/os-release rootfs/usr/lib/os-release
          sudo cp ubuntu-base/rootfs/etc/hostname rootfs/etc/hostname
          sudo cp ubuntu-base/rootfs/etc/apt/preferences.d/nosnap.pref rootfs/etc/apt/preferences.d/
          sudo cp ubuntu-base/rootfs/etc/sysctl.d/99-uzos-performance.conf rootfs/etc/sysctl.d/
          sudo cp ubuntu-base/rootfs/etc/default/zram-tools rootfs/etc/default/

          # 7. Configure Casper Live Hostname and Identity
          cat <<'EOF' | sudo tee rootfs/etc/casper.conf
          export USERNAME="uzos"
          export USERFULLNAME="UzOS Live"
          export HOST="uzos"
          export BUILD_SYSTEM="UzOS"
          export FLAVOUR="UzOS"
          EOF

          # 8. Configure Passwordless Sudo & GDM3 Autologin for Live User
          echo 'uzos ALL=(ALL) NOPASSWD:ALL' | sudo tee rootfs/etc/sudoers.d/uzos
          sudo chmod 0440 rootfs/etc/sudoers.d/uzos

          cat <<'EOF' | sudo tee rootfs/etc/gdm3/custom.conf
          [daemon]
          AutomaticLoginEnable=true
          AutomaticLogin=uzos
          WaylandEnable=true
          EOF

      - name: Install Linux Kernel, Full Drivers & Graphical Installer into RootFS
        run: |
          # Chroot mount
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /dev/pts rootfs/dev/pts
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

          sudo chroot rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            # 1. Full repository sources
            cat <<'SOURCES' > /etc/apt/sources.list.d/ubuntu.sources
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES

            apt update -y

            # 2. Install Linux Kernel, Firmware, GDM3, GNOME Core, Hardware Drivers, Qt6, and Calamares
            apt install -y --no-install-recommends \
              linux-image-generic \
              linux-firmware \
              initramfs-tools \
              systemd-sysv \
              casper \
              plymouth-theme-spinner \
              gdm3 \
              gnome-core \
              gnome-terminal \
              xserver-xorg-video-all \
              pipewire \
              pipewire-audio-client-libraries \
              wireplumber \
              network-manager \
              wireless-regdb \
              wpasupplicant \
              labwc \
              libqt6core6 \
              libqt6gui6 \
              libqt6qml6 \
              libqt6quick6 \
              libqt6quickcontrols2-6 \
              qml6-module-qtquick \
              qml6-module-qtquick-controls \
              qml6-module-qtquick-window \
              qml6-module-qtquick-layouts \
              calamares \
              calamares-settings-lubuntu \
              zram-tools \
              fonts-inter \
              fonts-roboto \
              sudo \
              curl

            # 3. Purge Telemetry, Office Apps, and Unwanted Bloatware
            apt purge -y \
              ubuntu-report \
              popularity-contest \
              whoopsie \
              apport \
              apport-symptoms \
              libreoffice* \
              thunderbird* \
              gnome-games* || true
            apt autoremove -y --purge

            # 4. Compile GNOME Schemas for Default Telegram Theme & Wallpaper
            glib-compile-schemas /usr/share/glib-2.0/schemas/ || true

            # 5. Create default 'uzos' user for live session
            if ! id uzos &>/dev/null; then
              useradd -m -s /bin/bash -G sudo,audio,video,plugdev,netdev uzos
              echo 'uzos:uzos' | chpasswd
            fi

            # 6. Place Graphical Installer shortcut on Desktop
            mkdir -p /home/uzos/Desktop
            cp /usr/share/applications/install-uzos.desktop /home/uzos/Desktop/
            chmod +x /home/uzos/Desktop/install-uzos.desktop
            chown -R uzos:uzos /home/uzos

            # 7. Enable graphical boot mode and services
            systemctl set-default graphical.target
            systemctl enable NetworkManager.service || true
            systemctl enable gdm3.service || true

            # 8. Rebuild initramfs with UzOS Plymouth splash and Casper branding
            update-initramfs -u -k all || true

            apt clean
          "

          sudo umount -lf rootfs/dev/pts 2>/dev/null || true
          sudo umount -lf rootfs/dev 2>/dev/null || true
          sudo umount -lf rootfs/proc 2>/dev/null || true
          sudo umount -lf rootfs/sys 2>/dev/null || true

      - name: Build Bootable ISO Image
        run: |
          mkdir -p build/iso/casper build/iso/boot/grub output

          # Extract kernel and initrd with symlink resolution
          KERNEL=$(ls -1 rootfs/boot/vmlinuz* 2>/dev/null | grep -v "old" | head -n 1)
          INITRD=$(ls -1 rootfs/boot/initrd.img* 2>/dev/null | grep -v "old" | head -n 1)
          echo "Using Kernel: $KERNEL"
          echo "Using Initrd: $INITRD"
          sudo cp -L "$KERNEL" build/iso/casper/vmlinuz
          sudo cp -L "$INITRD" build/iso/casper/initrd

          printf $(sudo du -sx --block-size=1 rootfs | cut -f1) | sudo tee build/iso/casper/filesystem.size

          cat <<'EOF' > build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=5
          insmod efi_gop
          insmod font

          menuentry "UzOS 24.04 LTS (Telegram UI - Jonli sinov)" {
              set gfxpayload=keep
              linux /casper/vmlinuz boot=casper quiet splash ---
              initrd /casper/initrd
          }

          menuentry "UzOS 24.04 LTS ni o'rnatish (Grafik o'rnatuvchi)" {
              set gfxpayload=keep
              linux /casper/vmlinuz boot=casper quiet splash ---
              initrd /casper/initrd
          }

          menuentry "UzOS 24.04 LTS (Xavfsiz grafik rejim / Safe Graphics)" {
              set gfxpayload=keep
              linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
              initrd /casper/initrd
          }
          EOF

          echo "SquashFS siqilmoqda (zstd)..."
          sudo mksquashfs rootfs build/iso/casper/filesystem.squashfs \
            -comp zstd -Xcompression-level 9 \
            -e "boot/vmlinuz*" -e "boot/initrd.img*"

          echo "ISO yaratilmoqda..."
          sudo grub-mkrescue -o output/uzos-24.04-desktop-amd64.iso build/iso

      - name: Upload UzOS ISO to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uzos-24.04-desktop-amd64-iso
          path: output/uzos-24.04-desktop-amd64.iso
          if-no-files-found: error
          retention-days: 14
