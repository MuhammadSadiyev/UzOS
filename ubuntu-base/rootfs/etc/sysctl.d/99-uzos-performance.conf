# ==============================================================================
# UzOS Linux Kernel High-Performance Tuning
# Windows'dan tezkor va yengil ishlash parametrlari
# ==============================================================================

# Xotira boshqaruvi: RAM to'lmaguncha diskka swap yozmaslik
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Ko'p oqimli ilovalar va fayl tizimi sig'imi
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# Tarmoq buferini kengaytirish (past kechikishli yuklamalar)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3
