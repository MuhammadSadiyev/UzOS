<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="uzosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5278" />
      <stop offset="50%" stop-color="#17212b" />
      <stop offset="100%" stop-color="#0e1621" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5288c1" />
      <stop offset="100%" stop-color="#2481cc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099b5" />
      <stop offset="50%" stop-color="#ce1126" />
      <stop offset="100%" stop-color="#1eb53a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2481cc" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#uzosGrad)" stroke="rgba(82, 136, 193, 0.3)" stroke-width="6"/>

  <!-- Sovereign Ring Indicator -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Stylized Cloud / Hypervisor Node -->
  <g filter="url(#glow)">
    <path d="M360 290c24 0 44-20 44-44 0-22-16-40-37-43-3-46-42-83-89-83-36 0-67 21-81 52-6-3-14-4-21-4-27 0-48 22-48 49 0 2 0 4 .3 6C108 227 92 244 92 266c0 26 21 48 48 48h220z" 
          fill="url(#cloudGrad)" opacity="0.95"/>
    
    <!-- Central Uzbek Star & Crescent / Core Processor Icon -->
    <circle cx="256" cy="245" r="32" fill="#ffffff" opacity="0.95"/>
    <path d="M256 225v40M236 245h40" stroke="#17212b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sovereign Stripe Pill at bottom -->
  <rect x="176" y="380" width="160" height="12" rx="6" fill="#0099b5"/>
  <rect x="220" y="380" width="72" height="12" fill="#ce1126"/>
  <rect x="236" y="380" width="40" height="12" fill="#1eb53a"/>
